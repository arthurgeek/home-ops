---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Resource Right-Sizing"

on:
  schedule:
    - cron: "0 4 * * 1" # Weekly at 04:00 UTC on Mondays
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  rightsize:
    name: "Resource Right-Sizing"
    runs-on: home-ops-runner
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Configure Git
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"

      - name: Run Right-Sizing Automation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run ./scripts/rightsize.py --create-pr --push
