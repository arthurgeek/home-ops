---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
spec:
  chartRef:
    kind: OCIRepository
    name: rook-ceph
  interval: 1h
  values:
    monitoring:
      enabled: true

    csi:
      serviceMonitor:
        enabled: true

    image:
      repository: ghcr.io/rook/ceph
