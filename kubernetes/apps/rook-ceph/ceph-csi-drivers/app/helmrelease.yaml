---
# Since Rook v1.20 the rook-ceph chart no longer deploys the CSI drivers;
# this chart configures them through the ceph-csi-operator that rook-ceph
# installs. Values follow Rook's recommended file
# (deploy/charts/ceph-csi-drivers/values.yaml), plus the settings Rook used
# to apply itself: snapshots enabled, two controller replicas, a 150s gRPC
# timeout and resource limits.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph-csi-drivers
spec:
  chart:
    spec:
      chart: ceph-csi-drivers
      version: 1.0.5
      sourceRef:
        kind: HelmRepository
        name: ceph-csi-operator
  interval: 1h
  values:
    operatorConfig:
      namespace: rook-ceph
      driverSpecDefaults:
        imageSet:
          name: rook-csi-operator-image-set-configmap
        log:
          rotation:
            enabled: false
        nodePlugin:
          priorityClassName: system-node-critical
          resources:
            plugin:
              limits:
                memory: 1Gi
              requests:
                cpu: 50m
                memory: 128Mi
            registrar:
              limits:
                memory: 256Mi
              requests:
                cpu: 10m
                memory: 32Mi
        controllerPlugin:
          priorityClassName: system-cluster-critical
          resources:
            attacher:
              limits:
                memory: 256Mi
              requests:
                cpu: 25m
                memory: 64Mi
            omapGenerator:
              limits:
                memory: 1Gi
              requests:
                cpu: 25m
                memory: 128Mi
            plugin:
              limits:
                memory: 1Gi
              requests:
                cpu: 25m
                memory: 128Mi
            provisioner:
              limits:
                memory: 256Mi
              requests:
                cpu: 25m
                memory: 64Mi
            resizer:
              limits:
                memory: 256Mi
              requests:
                cpu: 25m
                memory: 64Mi
            snapshotter:
              limits:
                memory: 256Mi
              requests:
                cpu: 25m
                memory: 64Mi
    drivers:
      rbd:
        enabled: true
        name: rook-ceph.rbd.csi.ceph.com
        grpcTimeout: 150
        snapshotPolicy: volumeGroupSnapshot
        log:
          rotation:
            enabled: false
        controllerPlugin:
          replicas: 2
      cephfs:
        enabled: true
        name: rook-ceph.cephfs.csi.ceph.com
        grpcTimeout: 150
        snapshotPolicy: volumeGroupSnapshot
        log:
          rotation:
            enabled: false
        controllerPlugin:
          replicas: 2
      nfs:
        enabled: false
        name: rook-ceph.nfs.csi.ceph.com
      nvmeof:
        enabled: false
        name: rook-ceph.nvmeof.csi.ceph.com
