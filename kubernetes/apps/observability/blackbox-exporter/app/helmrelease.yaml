---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: blackbox-exporter
  interval: 1h
  values:
    fullnameOverride: blackbox-exporter
    config:
      modules:
        # A call-sized echo, to compare the internet connections.
        icmp_1200:
          prober: icmp
          timeout: 5s
          icmp:
            preferred_ip_protocol: ip4
            payload_size: 1200
    # ICMP needs a raw socket.
    securityContext:
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        add: ["NET_RAW"]
    podSecurityContext:
      sysctls:
        - name: net.ipv4.ping_group_range
          value: "0 2147483647"
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 64Mi
    serviceMonitor:
      enabled: true
