---
# The NAS runs node-exporter as a TrueNAS app. It goes under the nodes' job,
# so their dashboard and host alerts cover the NAS as well.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: node-exporter-truenas
spec:
  staticConfigs:
    - targets:
        - 10.10.5.10:9100
  metricsPath: /metrics
  scrapeInterval: 30s
  relabelings:
    - action: replace
      targetLabel: job
      replacement: node-exporter
    - action: replace
      targetLabel: instance
      replacement: truenas
