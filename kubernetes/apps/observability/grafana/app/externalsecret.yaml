---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: grafana-secret
  data:
    - secretKey: oidc-client-secret
      remoteRef:
        key: grafana
        property: oidc-client-secret
