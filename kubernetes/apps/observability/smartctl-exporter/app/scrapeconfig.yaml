---
# The NAS runs the same exporter as a TrueNAS app.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: smartctl-exporter-truenas
spec:
  staticConfigs:
    - targets:
        - 10.10.5.10:9633
  metricsPath: /metrics
  scrapeInterval: 60s
  scrapeTimeout: 30s
  relabelings:
    - action: replace
      targetLabel: job
      replacement: smartctl-exporter
    - action: replace
      targetLabel: instance
      replacement: truenas
