---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unpoller
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: unpoller-secret
  data:
    - secretKey: UP_UNIFI_DEFAULT_API_KEY
      remoteRef:
        key: Unifi
        property: apiKey
