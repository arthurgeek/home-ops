---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: kubernetes-logs
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folder: Kubernetes
  json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "liveNow": true,
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "h": 6,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "title": "Log Volume",
          "type": "timeseries",
          "datasource": "victoria-logs",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 70,
                "gradientMode": "none",
                "lineWidth": 1
              },
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": "victoria-logs",
              "editorMode": "code",
              "expr": "kubernetes.pod_namespace:$namespace kubernetes.pod_name:$pod kubernetes.container_name:$container $search | stats by (_time:1m) count()",
              "queryType": "range",
              "refId": "A"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 22,
            "w": 24,
            "x": 0,
            "y": 6
          },
          "id": 2,
          "title": "Logs",
          "type": "logs",
          "datasource": "victoria-logs",
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": true,
            "showCommonLabels": false,
            "showLabels": true,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          },
          "targets": [
            {
              "datasource": "victoria-logs",
              "editorMode": "code",
              "expr": "kubernetes.pod_namespace:$namespace kubernetes.pod_name:$pod kubernetes.container_name:$container $search",
              "queryType": "range",
              "refId": "A"
            }
          ]
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": [
        "kubernetes",
        "logs",
        "victorialogs"
      ],
      "templating": {
        "list": [
          {
            "current": {
              "selected": true,
              "text": "All",
              "value": "$__all"
            },
            "datasource": "victoria-logs",
            "definition": "* | stats by (kubernetes.pod_namespace) count() | sort by (kubernetes.pod_namespace) | fields kubernetes.pod_namespace",
            "hide": 0,
            "includeAll": true,
            "label": "Namespace",
            "multi": false,
            "name": "namespace",
            "options": [],
            "query": "* | stats by (kubernetes.pod_namespace) count() | sort by (kubernetes.pod_namespace) | fields kubernetes.pod_namespace",
            "refresh": 1,
            "regex": "",
            "sort": 1,
            "type": "query"
          },
          {
            "current": {
              "selected": true,
              "text": "All",
              "value": "$__all"
            },
            "datasource": "victoria-logs",
            "definition": "kubernetes.pod_namespace:$namespace | stats by (kubernetes.pod_name) count() | sort by (kubernetes.pod_name) | fields kubernetes.pod_name",
            "hide": 0,
            "includeAll": true,
            "label": "Pod",
            "multi": true,
            "name": "pod",
            "options": [],
            "query": "kubernetes.pod_namespace:$namespace | stats by (kubernetes.pod_name) count() | sort by (kubernetes.pod_name) | fields kubernetes.pod_name",
            "refresh": 2,
            "regex": "",
            "sort": 1,
            "type": "query"
          },
          {
            "current": {
              "selected": true,
              "text": "All",
              "value": "$__all"
            },
            "datasource": "victoria-logs",
            "definition": "kubernetes.pod_namespace:$namespace kubernetes.pod_name:$pod | stats by (kubernetes.container_name) count() | sort by (kubernetes.container_name) | fields kubernetes.container_name",
            "hide": 0,
            "includeAll": true,
            "label": "Container",
            "multi": true,
            "name": "container",
            "options": [],
            "query": "kubernetes.pod_namespace:$namespace kubernetes.pod_name:$pod | stats by (kubernetes.container_name) count() | sort by (kubernetes.container_name) | fields kubernetes.container_name",
            "refresh": 2,
            "regex": "",
            "sort": 1,
            "type": "query"
          },
          {
            "current": {
              "selected": false,
              "text": "",
              "value": ""
            },
            "hide": 0,
            "label": "Search",
            "name": "search",
            "options": [],
            "query": "",
            "type": "textbox"
          }
        ]
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": [
          "5s",
          "10s",
          "30s",
          "1m",
          "5m",
          "15m",
          "30m",
          "1h",
          "2h",
          "1d"
        ]
      },
      "timezone": "browser",
      "title": "Kubernetes Logs",
      "uid": "k8s-logs"
    }
