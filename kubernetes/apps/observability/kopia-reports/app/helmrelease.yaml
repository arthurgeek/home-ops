---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kopia-reports
spec:
  chartRef:
    kind: OCIRepository
    name: kopia-reports
  interval: 1h
  values:
    controllers:
      *app :
        # The state sits on a volume that only one pod can hold at a time.
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/arthurgeek/kopia-reports
              tag: 0.1.0
            env:
              LISTEN: :8080
              STATE_FILE: /data/state.json
              TZ: America/Sao_Paulo
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 5m
                memory: 64Mi
              limits:
                memory: 64Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http:
            port: *port
    route:
      # The NAS's Kopia posts its reports here and cannot log in through the
      # gateway.
      app:
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
    serviceMonitor:
      app:
        serviceName: *app
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 30s
    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 100Mi
        storageClass: ceph-block
        globalMounts:
          - path: /data
