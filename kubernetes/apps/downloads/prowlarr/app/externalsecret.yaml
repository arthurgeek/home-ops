---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prowlarr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: prowlarr-secret
  data:
    - secretKey: PROWLARR__AUTH__APIKEY
      remoteRef:
        key: prowlarr
        property: api-key
