---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: sonarr-secret
  data:
    - secretKey: SONARR__AUTH__APIKEY
      remoteRef:
        key: sonarr
        property: api-key
