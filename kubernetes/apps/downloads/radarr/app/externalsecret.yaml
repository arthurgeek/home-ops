---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radarr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: radarr-secret
  data:
    - secretKey: RADARR__AUTH__APIKEY
      remoteRef:
        key: radarr
        property: api-key
