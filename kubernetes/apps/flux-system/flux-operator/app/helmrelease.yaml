---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
spec:
  chartRef:
    kind: OCIRepository
    name: flux-operator
  interval: 1h
  values:
    serviceMonitor:
      create: true
    web:
      # Rendered from 1Password by ../web; logins go through PocketID.
      configSecretName: flux-web-config
      httpRoute:
        enabled: true
        hostnames:
          - flux.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
      # The chart's policy admits only the UI port (9080) on the operator
      # pod, which would also block scraping its metrics.
      networkPolicy:
        create: false
