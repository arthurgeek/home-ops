---
# Web UI config, watched by the operator. A missing or invalid Secret only
# leaves the UI unconfigured; the same config inline would stop the operator
# from starting without the client secret during bootstrap.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-web-config
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: flux-web-config
    template:
      data:
        config.yaml: |
          apiVersion: web.fluxcd.controlplane.io/v1
          kind: Config
          spec:
            baseURL: https://flux.${SECRET_DOMAIN}
            authentication:
              type: OAuth2
              oauth2:
                provider: OIDC
                clientID: flux
                clientSecret: {{ .client_secret | toJson }}
                issuerURL: https://id.${SECRET_DOMAIN}
                autoLogin: true
        # Pushed to PocketID by the flux OIDC client.
        client_secret: "{{ .client_secret }}"
  data:
    - secretKey: client_secret
      remoteRef:
        key: flux
        property: oidc-client-secret
