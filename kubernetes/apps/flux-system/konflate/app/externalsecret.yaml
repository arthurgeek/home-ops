---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: konflate
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: konflate-secret
    template:
      data:
        KONFLATE_WEBHOOK_SECRET: '{{ index . "webhook-secret" }}'
        KONFLATE_APP_CLIENT_ID: '{{ index . "app-client-id" }}'
        # 1Password's concealed fields keep the PEM on one line; the PEM
        # parser needs line breaks around the header and footer.
        KONFLATE_APP_PRIVATE_KEY: |-
          -----BEGIN RSA PRIVATE KEY-----
          {{ index . "app-private-key" | replace "-----BEGIN RSA PRIVATE KEY-----" "" | replace "-----END RSA PRIVATE KEY-----" "" | trim | replace " " "\n" }}
          -----END RSA PRIVATE KEY-----
  dataFrom:
    - extract:
        key: konflate
