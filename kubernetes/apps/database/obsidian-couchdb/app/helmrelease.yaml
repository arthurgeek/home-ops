---
# CouchDB backend for Obsidian LiveSync, reachable only from the LAN.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: obsidian-couchdb
spec:
  chartRef:
    kind: OCIRepository
    name: obsidian-couchdb
  interval: 1h
  values:
    controllers:
      obsidian-couchdb:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # CouchDB's entrypoint needs a writable config directory it can
          # chown, so the ConfigMap is copied into an emptyDir rather than
          # mounted in place.
          init-config:
            image:
              repository: public.ecr.aws/docker/library/busybox
              tag: 1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
            command: ["sh", "-c", "cp /tmp/config/*.ini /opt/couchdb/etc/default.d/"]
        containers:
          app:
            image:
              repository: public.ecr.aws/docker/library/couchdb
              tag: 3.5.3@sha256:4e8e0a366208a87d5059b0f4fcbefff13c32401a655d4629c19be6288ea77675
            envFrom:
              - secretRef:
                  name: obsidian-couchdb-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 34m
                memory: 128Mi
              limits:
                memory: 512Mi
    service:
      app:
        ports:
          http:
            port: 5984
    route:
      app:
        hostnames: ["obsidian-db.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
    persistence:
      config:
        type: configMap
        name: obsidian-couchdb-configmap
        advancedMounts:
          obsidian-couchdb:
            init-config:
              - path: /tmp/config
      config-storage:
        type: emptyDir
        globalMounts:
          - path: /opt/couchdb/etc/default.d
      data:
        existingClaim: obsidian-couchdb-data
        advancedMounts:
          obsidian-couchdb:
            app:
              - path: /opt/couchdb/data
