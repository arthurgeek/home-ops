---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rustfs
spec:
  dependsOn:
    - name: onepassword-store
      namespace: external-secrets
    - name: pocket-id-operator
      namespace: security
  interval: 1h
  path: ./kubernetes/apps/storage/rustfs/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: storage
  wait: false
