---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app rustfs
spec:
  chartRef:
    kind: OCIRepository
    name: rustfs
  interval: 1h
  timeout: 10m
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: rustfs/rustfs
              tag: 1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
            args: ["/data"]
            env:
              RUSTFS_ADDRESS: ":9000"
              RUSTFS_CONSOLE_ADDRESS: ":9001"
              RUSTFS_CONSOLE_ENABLE: "true"
              RUSTFS_BROWSER_REDIRECT_URL: https://rustfs.${SECRET_DOMAIN}
              RUSTFS_SERVER_DOMAINS: s3.${SECRET_DOMAIN}
              # Console logins through PocketID. Policies come only from the
              # rustfs_policy claim, set by the rustfs-admins group: RustFS
              # rejects a login when any mapped value isn't a policy, so the
              # groups claim (every PocketID group) can't be used.
              # The client secret is in rustfs-secret.
              RUSTFS_IDENTITY_OPENID_ENABLE: "on"
              RUSTFS_IDENTITY_OPENID_CONFIG_URL: https://id.${SECRET_DOMAIN}
              RUSTFS_IDENTITY_OPENID_CLIENT_ID: rustfs
              RUSTFS_IDENTITY_OPENID_SCOPES: openid,profile,email
              RUSTFS_IDENTITY_OPENID_REDIRECT_URI: https://rustfs.${SECRET_DOMAIN}/rustfs/admin/v3/oidc/callback/default
              RUSTFS_IDENTITY_OPENID_CLAIM_NAME: rustfs_policy
              RUSTFS_IDENTITY_OPENID_GROUPS_CLAIM: rustfs_policy
              RUSTFS_IDENTITY_OPENID_DISPLAY_NAME: PocketID
              # PocketID resolves to the internal gateway, a private address
              # that RustFS only contacts when allowed.
              RUSTFS_OUTBOUND_ALLOW_ORIGINS: https://id.${SECRET_DOMAIN}
            envFrom:
              - secretRef:
                  name: rustfs-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &s3 9000
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness: *probes
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        # Owner of the data on TrueNAS (chowned from the old Synology IDs).
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http:
            port: &console 9001
          s3:
            port: *s3
    route:
      app:
        hostnames: ["rustfs.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *console
      s3:
        hostnames: ["s3.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *s3
    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /data
