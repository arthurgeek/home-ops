---
# The old MinIO data directory on TrueNAS; RustFS reads MinIO's on-disk
# format and imports its bucket metadata on first start (one-way).
# A static PV keeps the NFS mount options and never deletes the data.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: rustfs-nfs
spec:
  accessModes: ["ReadWriteOnce"]
  capacity:
    storage: 1Mi # not enforced for NFS
  claimRef:
    name: rustfs
    namespace: storage
  mountOptions:
    - nfsvers=4.1
    - nconnect=12
    - hard
    - noatime
  nfs:
    server: 10.10.5.10 # TrueNAS
    path: /mnt/fast/backups/k8s-data-1/minio
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Mi
  storageClassName: ""
  volumeName: rustfs-nfs
