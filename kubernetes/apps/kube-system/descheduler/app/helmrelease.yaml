---
# Evicts pods so the scheduler can place them better: rebalances nodes by
# actual usage (metrics-server) and clears failed or rule-violating pods.
# Evictions go through the eviction API, so PodDisruptionBudgets hold.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: descheduler
spec:
  chartRef:
    kind: OCIRepository
    name: descheduler
  interval: 1h
  values:
    kind: Deployment
    # Wakes up periodically and idles at a few millicores; the chart's
    # default request reserves half a core.
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 256Mi
    deschedulerPolicyAPIVersion: descheduler/v1alpha2
    deschedulerPolicy:
      # A few pods per pass, so rebalancing is gradual.
      maxNoOfPodsToEvictPerNode: 2
      maxNoOfPodsToEvictTotal: 4
      metricsProviders:
        - source: KubernetesMetrics
      profiles:
        - name: Default
          pluginConfig:
            - name: DefaultEvictor
              args:
                podProtections:
                  defaultDisabled:
                    - FailedBarePods
                    - PodsWithLocalStorage
            - name: LowNodeUtilization
              args:
                metricsUtilization:
                  source: KubernetesMetrics
                # The cluster's own services stay where they are: many are a
                # single replica fronting admission webhooks, the network,
                # GitOps or storage. Everything else, monitoring included,
                # can move.
                evictableNamespaces:
                  exclude:
                    - cert-manager
                    - external-secrets
                    - flux-system
                    - kopiur-system
                    - kube-system
                    - network
                    - rook-ceph
                # Nodes under all of these are underused; pods move off
                # nodes above any of the targets. The targets are low and
                # the pod allowance is wide, so CPU and memory decide: the
                # larger node already runs many small pods but has most of
                # the headroom.
                thresholds:
                  cpu: 20
                  memory: 30
                  pods: 60
                targetThresholds:
                  cpu: 25
                  memory: 40
                  pods: 80
            - name: RemoveFailedPods
              args:
                reasons:
                  - ContainerStatusUnknown
                  - NodeAffinity
                  - NodeShutdown
                  - Terminated
                  - UnexpectedAdmissionError
                includingInitContainers: true
                excludeOwnerKinds:
                  - Job
                minPodLifetimeSeconds: 1800
            - name: RemovePodsViolatingInterPodAntiAffinity
            - name: RemovePodsViolatingNodeAffinity
              args:
                nodeAffinityType:
                  - requiredDuringSchedulingIgnoredDuringExecution
                  - preferredDuringSchedulingIgnoredDuringExecution
                # Preferred affinity only moves media apps back to their GPU
                # node; other charts' soft preferences stay as scheduled.
                namespaces:
                  include:
                    - media
            - name: RemovePodsViolatingNodeTaints
            - name: RemovePodsViolatingTopologySpreadConstraint
          plugins:
            balance:
              enabled:
                - LowNodeUtilization
                - RemovePodsViolatingTopologySpreadConstraint
            deschedule:
              enabled:
                - RemoveFailedPods
                - RemovePodsViolatingInterPodAntiAffinity
                - RemovePodsViolatingNodeAffinity
                - RemovePodsViolatingNodeTaints
    service:
      enabled: true
    serviceMonitor:
      enabled: true
    leaderElection:
      enabled: true
