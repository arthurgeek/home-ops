---
# Exposes the nodes' Intel iGPUs through Dynamic Resource Allocation; apps
# request one with a ResourceClaimTemplate.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-gpu-resource-driver
spec:
  chartRef:
    kind: OCIRepository
    name: intel-gpu-resource-driver
  interval: 1h
  values:
    # The default static path, /etc/cdi, is read-only on Talos.
    cdi:
      staticPath: /run/cdi
      dynamicPath: /run/cdi
    kubeletPlugin:
      # Without the xpumd health service the plugin needs privileged mode to
      # read GPU details.
      privileged: true
      healthMonitoring:
        enabled: false
