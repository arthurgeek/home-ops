---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ocharted
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ocharted-secret
    template:
      data:
        auth: "{{ .OCHARTED_USERNAME }}:{{ .password }}"
  dataFrom:
    - extract:
        key: ocharted
