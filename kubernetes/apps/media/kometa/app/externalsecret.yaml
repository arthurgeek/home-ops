---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kometa
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kometa-secret
    template:
      data:
        config.yml: |
          plex:
            url: http://plex.network.svc.cluster.local:32400
            token: {{ index . "plex-token" }}
            timeout: 60
          mdblist:
            apikey: {{ index . "mdblist-api-key" }}
          tmdb:
            apikey: {{ index . "tmdb-api-key" }}
            language: pt
            region: BR
          settings:
            cache: true
            cache_expiration: 60
            asset_directory: /config/assets
            run_order:
              - operations
              - metadata
              - collections
              - overlays
          libraries:
            Filmes:
              collection_files:
                - default: basic
                - default: tmdb
                - default: imdb
                - default: genre
                - default: franchise
                - default: universe
                - default: decade
                - file: /config/br-ratings.yml
                - default: audio_language
                - default: based
                - default: seasonal
                - default: studio
                - default: streaming
                  template_variables:
                    region: BR
                    # Free catalogs with thousands of titles, almost none of
                    # them in the library, that make a run very slow.
                    exclude:
                      - tubi
                      - youtube
                - default: oscars
                - default: golden
                - default: bafta
                - default: cannes
              overlay_files:
                - default: resolution
                - default: video_format
                - default: audio_codec
                - default: languages
                - default: ratings
                - default: ribbon
                  template_variables:
                    use_all: false
                    use_oscars: true
                    use_golden: true
                    use_bafta: true
                    use_imdb: true
                    use_metacritic: true
            Programas de TV:
              collection_files:
                - default: basic
                - default: tmdb
                - default: imdb
                - default: genre
                - default: franchise
                - default: decade
                - file: /config/br-ratings.yml
                - default: audio_language
                - default: based
                - default: network
                - default: streaming
                  template_variables:
                    region: BR
                    # Free catalogs with thousands of titles, almost none of
                    # them in the library, that make a run very slow.
                    exclude:
                      - tubi
                      - youtube
                - default: emmy
                - default: golden
                - default: sag
              overlay_files:
                - default: resolution
                - default: video_format
                - default: audio_codec
                - default: languages
                - default: ratings
                - default: resolution
                  template_variables:
                    builder_level: season
                - default: resolution
                  template_variables:
                    builder_level: episode
                - default: episode_info
                - default: ribbon
                  template_variables:
                    use_all: false
                    use_emmys: true
                    use_imdb: true
                    use_metacritic: true
                - default: status
  data:
    - secretKey: plex-token
      remoteRef:
        key: plex
        property: token
    - secretKey: mdblist-api-key
      remoteRef:
        key: mdblist
        property: api-key
    - secretKey: tmdb-api-key
      remoteRef:
        key: tmdb
        property: api-key
