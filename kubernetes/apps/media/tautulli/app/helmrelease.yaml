---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app tautulli
spec:
  chartRef:
    kind: OCIRepository
    name: tautulli
  interval: 1h
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # The scripts run by Tautulli need packages the image does not ship.
          install-deps:
            image:
              repository: ghcr.io/home-operations/tautulli
              tag: 2.18.2@sha256:5d55eb06f2b77eb09001b2f884b0b3a9ed3adf8416c6209c563796e18eaa43a4
            env:
              HOME: /tmp
              PIP_DISABLE_PIP_VERSION_CHECK: "1"
            command:
              - python3
              - -m
              - pip
              - install
              - --quiet
              - --no-cache-dir
              - --target=/pylib
              - requests==2.34.2
              - plexapi==4.18.3
              - future==1.0.0
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/tautulli
              tag: 2.18.2@sha256:5d55eb06f2b77eb09001b2f884b0b3a9ed3adf8416c6209c563796e18eaa43a4
            env:
              PYTHONPATH: /pylib
              TZ: America/Sao_Paulo
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /status
                    port: &port 8181
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
          # Keeps a copy of the JBOPS scripts, which Tautulli runs from
          # /add-ons/JBOPS.
          jbops:
            image:
              repository: registry.k8s.io/git-sync/git-sync
              tag: v4.7.1@sha256:c5e1976da735bf0b53979f079a07475d77174c51863cd084e928ff6074480717
            env:
              GITSYNC_REPO: https://github.com/blacktwin/JBOPS
              GITSYNC_REF: master
              GITSYNC_PERIOD: 24h
              GITSYNC_ROOT: /add-ons
              GITSYNC_LINK: JBOPS
              HOME: /tmp
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http:
            port: *port
    route:
      # Tautulli's own login is switched off; the gateway asks for PocketID.
      app:
        labels:
          oidc: pocket-id
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media
          gethomepage.dev/name: Tautulli
          gethomepage.dev/icon: tautulli.png
          gethomepage.dev/description: Plex Monitoring & Stats
          gethomepage.dev/pod-selector: app.kubernetes.io/name=tautulli
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
    persistence:
      config:
        existingClaim: *app
      tmp:
        type: emptyDir
      # Scripts kept in this repo; JBOPS ones are under /add-ons.
      scripts:
        type: configMap
        name: tautulli-scripts
        defaultMode: 0755
        globalMounts:
          - path: /scripts
            readOnly: true
      add-ons:
        type: emptyDir
        advancedMounts:
          tautulli:
            jbops:
              - path: /add-ons
            app:
              - path: /add-ons
                readOnly: true
      # Kept apart from /add-ons, which git-sync clears.
      pylib:
        type: emptyDir
        advancedMounts:
          tautulli:
            install-deps:
              - path: /pylib
            app:
              - path: /pylib
                readOnly: true
