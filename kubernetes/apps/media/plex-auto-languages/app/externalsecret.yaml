---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plex-auto-languages
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: plex-auto-languages-secret
  data:
    - secretKey: PLEX_TOKEN
      remoteRef:
        key: plex
        property: token
