---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: plex
spec:
  mergeType: StrategicMerge
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: plex
  requestBuffer:
    limit: 1Mi
  timeout:
    http:
      connectionIdleTimeout: 300s
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: plex-events
spec:
  mergeType: StrategicMerge
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: plex
      # Request buffering hangs WebSocket upgrades, so this rule gets the
      # policy without it.
      sectionName: events
  timeout:
    http:
      connectionIdleTimeout: 300s
