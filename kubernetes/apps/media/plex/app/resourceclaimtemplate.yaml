---
# The 12th-gen UHD 730 (k8s-2); newer media engine than the other nodes' UHD 630.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: plex
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.intel.com
            selectors:
              - cel:
                  expression: device.attributes["gpu.intel.com"].pciId == "0x4692"
