---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex
spec:
  chartRef:
    kind: OCIRepository
    name: plex
  interval: 1h
  values:
    controllers:
      plex:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/plex
              tag: 1.43.4.10903@sha256:fdc6fe82bc7d8acd08fc0aa581fcb76722803ba5905e2537135a697347dd6149
            env:
              TZ: America/Sao_Paulo
              PLEX_ADVERTISE_URL: https://plex.${SECRET_DOMAIN}:443,http://10.10.5.230:32400,http://plex.media.svc.cluster.local:32400
              PLEX_NO_AUTH_NETWORKS: 10.10.2.0/24
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /identity
                    port: &port 32400
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              claims:
                - name: gpu
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 8Gi
    defaultPodOptions:
      # Favour k8s-2, the node with the 12th-gen iGPU the claim prefers; the
      # descheduler moves Plex back there when it can.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["k8s-2"]
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: plex
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 10.10.5.230
        # Keeps client IPs so Plex recognises LAN clients as local.
        externalTrafficPolicy: Local
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["plex.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - name: app
            backendRefs: &backendRefs
              - identifier: app
                port: *port
            filters:
              - type: RequestHeaderModifier
                requestHeaderModifier: &pipeline
                  set:
                    # Plex closes idle keep-alive connections after 20s
                    # unless this is set, so Envoy owns the pool.
                    - name: X-Plex-Http-Pipeline
                      value: infinite
          - name: events
            backendRefs: *backendRefs
            filters:
              - type: RequestHeaderModifier
                requestHeaderModifier: *pipeline
            matches:
              - path:
                  type: PathPrefix
                  value: /:/eventsource
              - path:
                  type: PathPrefix
                  value: /:/websockets
          - # https://forums.plex.tv/t/external-srt-subtitles-are-not-working-w-reverse-proxy/886540
            name: subtitles
            backendRefs: *backendRefs
            filters:
              - type: RequestHeaderModifier
                requestHeaderModifier:
                  <<: *pipeline
                  remove:
                    - Range
            matches:
              - path:
                  type: PathPrefix
                  value: /library/streams
    persistence:
      config:
        existingClaim: plex-config
      # Regenerable (thumbnails, metadata caches) and node-local, so Plex can
      # run on whichever node has a GPU for it.
      cache:
        type: emptyDir
        sizeLimit: 20Gi
        globalMounts:
          - path: /config/Library/Application Support/Plex Media Server/Cache
      # Library paths in Plex's database are /data/Media/{Movies,TV}.
      media:
        existingClaim: media
        globalMounts:
          - path: /data/Media
            readOnly: true
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /config/Library/Application Support/Plex Media Server/Logs
            subPath: logs
          - path: /transcode
            subPath: transcode
          - path: /tmp
            subPath: tmp
