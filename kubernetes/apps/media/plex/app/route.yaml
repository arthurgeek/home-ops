---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: plex
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Media
    gethomepage.dev/name: Plex
    gethomepage.dev/icon: plex.png
    gethomepage.dev/description: Media Server
    gethomepage.dev/pod-selector: app.kubernetes.io/name=plex
spec:
  hostnames: ["plex.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - name: app
      backendRefs: &backendRefs
        - name: plex
          port: 32400
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier: &pipeline
            set:
              - name: X-Plex-Http-Pipeline
                value: infinite
    - name: events
      backendRefs: *backendRefs
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier: *pipeline
      matches:
        - path:
            type: PathPrefix
            value: /:/eventsource
        - path:
            type: PathPrefix
            value: /:/websockets
    - name: subtitles
      backendRefs: *backendRefs
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            <<: *pipeline
            remove:
              - Range
      matches:
        - path:
            type: PathPrefix
            value: /library/streams
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: plex
spec:
  mergeType: StrategicMerge
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: plex
  requestBuffer:
    limit: 1Mi
  timeout:
    http:
      connectionIdleTimeout: 300s
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: plex-events
spec:
  mergeType: StrategicMerge
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: plex
      sectionName: events
  timeout:
    http:
      connectionIdleTimeout: 300s
