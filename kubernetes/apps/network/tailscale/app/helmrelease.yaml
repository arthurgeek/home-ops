---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app tailscale
spec:
  chartRef:
    kind: OCIRepository
    name: tailscale
  interval: 1h
  values:
    global:
      fullnameOverride: tailscale-k8s
    controllers:
      *app :
        # Two routers on different nodes advertise the same network, so the
        # tailnet keeps working through one node's outage. The first replica is
        # also the exit node. Names and node state are stable across restarts,
        # so clients keep their exit-node choice.
        type: statefulset
        replicas: 2
        statefulset:
          podManagementPolicy: Parallel
          volumeClaimTemplates:
            - name: state
              globalMounts:
                - path: /var/lib/tailscale
              accessMode: ReadWriteOnce
              size: 100Mi
              storageClass: ceph-block
        initContainers:
          forwarding:
            image:
              repository: ghcr.io/tailscale/tailscale
              tag: v1.102.5@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
            command:
              - sh
              - -c
              - |
                echo 1 > /proc/sys/net/ipv4/ip_forward
                echo 1 > /proc/sys/net/ipv6/conf/all/forwarding
            securityContext:
              privileged: true
              runAsUser: 0
              runAsNonRoot: false
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/tailscale/tailscale
              tag: v1.102.5@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
            command:
              - sh
              - -c
              - |
                if [ "$TS_HOSTNAME" = tailscale-k8s-0 ]; then
                  export TS_EXTRA_ARGS=--advertise-exit-node
                fi
                exec /usr/local/bin/containerboot
            env:
              NO_AUTOUPDATE: true
              TZ: America/Sao_Paulo
              TS_USERSPACE: false
              # The Talos kernel has no legacy iptables tables.
              TS_DEBUG_FIREWALL_MODE: nftables
              TS_STATE_DIR: /var/lib/tailscale
              TS_SOCKET: /tmp/tailscaled.sock
              TS_KUBE_SECRET: ""
              TS_ACCEPT_DNS: false
              TS_ROUTES: 10.10.5.0/24
              TS_ENABLE_HEALTH_CHECK: true
              TS_LOCAL_ADDR_PORT: 0.0.0.0:9002
              TS_HOSTNAME:
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
            envFrom:
              - secretRef:
                  name: tailscale-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 9002
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsUser: 0
              runAsNonRoot: false
              capabilities:
                drop: ["ALL"]
                add: ["NET_ADMIN"]
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: *app
    service:
      app:
        ports:
          http:
            port: *port
    persistence:
      tun:
        type: hostPath
        hostPath: /dev/net/tun
        hostPathType: CharDevice
        advancedMounts:
          tailscale:
            app:
              - path: /dev/net/tun
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      run:
        type: emptyDir
        advancedMounts:
          tailscale:
            app:
              - path: /run
      cache:
        type: emptyDir
        globalMounts:
          - path: /.cache
