---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unifi-dns
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    deletionPolicy: Merge
    name: unifi-dns-secret
  data:
    - secretKey: UNIFI_API_KEY
      remoteRef:
        key: Unifi
        property: apiKey
