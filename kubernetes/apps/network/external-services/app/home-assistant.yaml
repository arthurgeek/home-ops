---
# Home Assistant runs outside the cluster; same pattern as truenas.yaml.
# HA must trust Envoy as a reverse proxy (http.use_x_forwarded_for and
# http.trusted_proxies in its configuration.yaml) or it rejects requests.
# The route is on both gateways so the companion app works away from home;
# HA's own login is the only gate, there is no OIDC in front of it.
apiVersion: v1
kind: Service
metadata:
  name: home-assistant
spec:
  ports:
    - name: http
      port: 8123
      targetPort: 8123
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: home-assistant
  labels:
    kubernetes.io/service-name: home-assistant
addressType: IPv4
endpoints:
  - addresses: ["10.10.4.10"] # UniFi DHCP reservation on the IoT network
    conditions:
      ready: true
ports:
  - name: http
    port: 8123
    protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant
spec:
  hostnames: ["ha.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: home-assistant
          port: 8123
