---
# TrueNAS runs outside the cluster; this gives it a LAN hostname (via
# unifi-dns) and the wildcard certificate by routing through envoy-internal.
apiVersion: v1
kind: Service
metadata:
  name: truenas
spec:
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: truenas
  labels:
    kubernetes.io/service-name: truenas
addressType: IPv4
endpoints:
  - addresses: ["10.10.5.10"] # UniFi DHCP reservation on the Server network
    conditions:
      ready: true
ports:
  - name: http
    port: 80
    protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: truenas
spec:
  hostnames: ["truenas.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: truenas
          port: 80
