---
# Music Assistant streaming server runs as an add-on on Home Assistant (10.10.4.10:8097).
# Alexa devices (Echo Dot, Echo Pop) require HTTPS to stream audio files.
# Routing through envoy-external gives it a public hostname with valid SSL.
apiVersion: v1
kind: Service
metadata:
  name: music-assistant-stream
spec:
  ports:
    - name: stream
      port: 8097
      targetPort: 8097
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: music-assistant-stream
  labels:
    kubernetes.io/service-name: music-assistant-stream
addressType: IPv4
endpoints:
  - addresses: ["10.10.4.10"]
    conditions:
      ready: true
ports:
  - name: stream
    port: 8097
    protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: music-assistant-stream
spec:
  hostnames: ["music-stream.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: music-assistant-stream
          port: 8097
