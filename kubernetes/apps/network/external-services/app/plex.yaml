---
# Plex runs on TrueNAS, next to the media; this gives it a LAN hostname (via
# unifi-dns) and the wildcard certificate by routing through envoy-internal.
apiVersion: v1
kind: Service
metadata:
  name: plex
spec:
  ports:
    - name: http
      port: 32400
      targetPort: 32400
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: plex
  labels:
    kubernetes.io/service-name: plex
addressType: IPv4
endpoints:
  - addresses: ["10.10.5.10"] # TrueNAS
    conditions:
      ready: true
ports:
  - name: http
    port: 32400
    protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: plex
spec:
  hostnames: ["plex.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - name: app
      backendRefs: &backendRefs
        - name: plex
          port: 32400
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier: &pipeline
            set:
              # Plex closes idle keep-alive connections after 20s unless this
              # is set, so Envoy owns the pool.
              - name: X-Plex-Http-Pipeline
                value: infinite
    - name: events
      backendRefs: *backendRefs
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier: *pipeline
      matches:
        - path:
            type: PathPrefix
            value: /:/eventsource
        - path:
            type: PathPrefix
            value: /:/websockets
    - # https://forums.plex.tv/t/external-srt-subtitles-are-not-working-w-reverse-proxy/886540
      name: subtitles
      backendRefs: *backendRefs
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            <<: *pipeline
            remove:
              - Range
      matches:
        - path:
            type: PathPrefix
            value: /library/streams
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: plex
spec:
  mergeType: StrategicMerge
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: plex
  requestBuffer:
    limit: 1Mi
  timeout:
    http:
      connectionIdleTimeout: 300s
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: plex-events
spec:
  mergeType: StrategicMerge
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: plex
      # Request buffering hangs WebSocket upgrades, so this rule gets the
      # policy without it.
      sectionName: events
  timeout:
    http:
      connectionIdleTimeout: 300s
