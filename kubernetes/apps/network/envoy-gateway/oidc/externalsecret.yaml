---
# Client secret shared by every namespace's gateway SecurityPolicy and pushed
# to PocketID by the envoy OIDC client.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: envoy-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: envoy-oidc
  data:
    - secretKey: client-secret
      remoteRef:
        key: envoy-oidc
        property: oidc-client-secret
