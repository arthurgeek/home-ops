---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-oidc
spec:
  dependsOn:
    - name: envoy-gateway-oidc
      namespace: network
  interval: 1h
  path: ./kubernetes/apps/default/gateway-oidc/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false
