---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
data:
  settings.yaml: |
    ---
    title: Home
    theme: dark
    color: slate
    cardBlur: sm
    showStats: true
    layout:
      Media:
        style: row
        columns: 4
      Downloads:
        style: row
        columns: 4
      Observability:
        style: row
        columns: 4
      Infrastructure:
        style: row
        columns: 4
  kubernetes.yaml: |
    ---
    mode: cluster
    gateway: true
    ingress: true
  widgets.yaml: |
    ---
    - search:
        provider: google
        target: _blank
    - datetime:
        text_size: xl
        format:
          timeStyle: short
          dateStyle: medium
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
  services.yaml: |
    ---
    - Media:
        - Plex:
            icon: plex.png
            href: https://plex.${SECRET_DOMAIN}
            description: Plex Media Server
            siteMonitor: http://plex.network.svc.cluster.local:32400/identity
            statusStyle: basic
    - Downloads: []
    - Observability: []
    - Infrastructure:
        - Home Assistant:
            icon: home-assistant.png
            href: https://ha.${SECRET_DOMAIN}
            description: Home Automation
            siteMonitor: http://home-assistant.network.svc.cluster.local:8123
            statusStyle: basic
        - TrueNAS:
            icon: truenas.png
            href: https://truenas.${SECRET_DOMAIN}
            description: Storage & ZFS NAS
            siteMonitor: http://truenas.network.svc.cluster.local
            statusStyle: basic
  bookmarks.yaml: |
    ---
    - Links:
        - GitHub:
            - icon: github.png
              href: https://github.com
  docker.yaml: ""
  proxmox.yaml: ""
  custom.js: ""
  custom.css: ""
