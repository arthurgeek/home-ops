---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pocket-id-operator
spec:
  interval: 1h
  path: ./kubernetes/apps/security/pocket-id/operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: security
  # The instance and resources below need the CRDs this installs.
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pocket-id-instance
spec:
  # The operator creates the claim; only backups come from kopiur.
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: kopiur-repository
      namespace: kopiur-system
    - name: onepassword-store
      namespace: external-secrets
    - name: pocket-id-operator
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  path: ./kubernetes/apps/security/pocket-id/instance
  postBuild:
    substitute:
      APP: pocket-id
      KOPIUR_CLAIM: pocket-id-data
      # PocketID writes its data as 65534 with the pod's fsGroup (65532);
      # its uploads directory is owner-only.
      KOPIUR_PUID: "65534"
      KOPIUR_PGID: "65532"
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: security
  wait: false
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pocket-id-resources
spec:
  dependsOn:
    - name: pocket-id-instance
  interval: 1h
  path: ./kubernetes/apps/security/pocket-id/resources
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: security
  wait: false
