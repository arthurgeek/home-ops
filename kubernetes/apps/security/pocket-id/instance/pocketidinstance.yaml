---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDInstance
metadata:
  name: pocket-id
spec:
  image: ghcr.io/pocket-id/pocket-id:v2.17.0-distroless@sha256:b009a094716d0a21db821641a0ff41a1dbdf648924f4c1555f5f2430dffb9fd3
  appUrl: https://id.${SECRET_DOMAIN}
  timezone: America/Sao_Paulo
  # Encrypts sensitive data in the database; kept in 1Password so a restored
  # backup stays readable.
  encryptionKey:
    valueFrom:
      secretKeyRef:
        name: pocket-id-secret
        key: ENCRYPTION_KEY
  analyticsDisabled: true
  versionCheckDisabled: true
  route:
    enabled: true
    hostnames:
      - id.${SECRET_DOMAIN}
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https
  # SQLite. Users, groups and OIDC clients are declared in git and recreated
  # by the operator; only passkeys live solely here.
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ceph-block
  # PocketID runs as 65534; the fsGroup gives its data group 65532.
  podSecurityContext:
    fsGroup: 65532
    fsGroupChangePolicy: OnRootMismatch
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 256Mi
