---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: pocket-id-secret
  data:
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: pocket-id
        property: encryption-key
