---
# Profile details stay in 1Password; the repo is public.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id-owner
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: pocket-id-owner
    template:
      data:
        username: "{{ .username }}"
        email: "{{ .email }}"
        firstName: '{{ index . "first-name" }}'
        lastName: '{{ index . "last-name" }}'
        displayName: '{{ index . "first-name" }} {{ index . "last-name" }}'
  dataFrom:
    - extract:
        key: pocket-id
