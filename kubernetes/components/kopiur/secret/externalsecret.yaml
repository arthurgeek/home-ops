---
# The rustfs repository's credentials, in every namespace whose backups run
# there: mover Jobs load them from their own namespace. The kopiur RustFS
# user may only use the kopiur bucket.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-repository
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kopiur-repository-secret
  dataFrom:
    - extract:
        key: kopiur
