---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "${KOPIUR_CLAIM}"
  annotations:
    # The data source only matters at creation; Flux never updates an
    # existing claim, including ones first created from another source.
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
  accessModes: ["${KOPIUR_ACCESSMODES:=ReadWriteOnce}"]
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: "${APP}"
  resources:
    requests:
      storage: "${KOPIUR_CAPACITY:=1Gi}"
  storageClassName: "${KOPIUR_STORAGECLASS:=ceph-block}"
